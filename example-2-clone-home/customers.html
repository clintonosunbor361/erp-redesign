<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Customers — Siohioma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="design-system/tokens.css">
  <link rel="stylesheet" href="design-system/components.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="customers.css">
  <link rel="stylesheet" href="design-system/typography.css">
</head>
<body>
  <main class="app customers-app">
    <aside class="sidebar" id="sidebar">
      <a href="index.html" class="logo" data-theme-link><span>✳</span><span class="brand-name">Siohioma</span></a>
      <button class="sidebar-toggle" type="button" aria-label="Collapse sidebar" aria-expanded="true" aria-controls="sidebar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m14 6-6 6 6 6"/></svg></button>
      <nav aria-label="Main navigation">
        <a href="index.html" data-theme-link aria-label="Dashboard"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span class="nav-text">Dashboard</span></a>
        <a href="orders.html" data-theme-link aria-label="Orders"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65"><path d="M5 7h14l2 14H3L5 7Z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/></svg><span class="nav-text">Orders</span></a>
        <a href="inventory.html" data-theme-link aria-label="Inventory"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65"><path d="m4 7 8-4 8 4-8 4-8-4Z"/><path d="m4 7v10l8 4 8-4V7M12 11v10"/></svg><span class="nav-text">Inventory</span></a>
        <a class="active" aria-current="page" href="customers.html" aria-label="Customers"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65"><circle cx="9" cy="8" r="3"/><path d="M3 21v-2a6 6 0 0 1 12 0v2m1-16a3 3 0 0 1 0 6m2 4a5 5 0 0 1 3 4v2"/></svg><span class="nav-text">Customers</span></a>
        <a href="#analytics" aria-label="Analytics"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65"><path d="M4 3v18h17M8 17v-5m5 5V7m5 10V4"/></svg><span class="nav-text">Analytics</span></a>
      </nav>
      <div class="sidebar-footer">
        <div class="divider"></div>
        <nav aria-label="Workspace settings">
          <a href="#settings"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65"><path d="m9 3 1-2h4l1 2 3 2 2 1v4l-1 2 1 2v4l-3 1-2 2h-5l-2-2-3-1v-4l1-2-1-2V6l2-1 2-2Z"/><circle cx="12" cy="12" r="3"/></svg><span class="nav-text">Settings</span></a>
          <a href="#team"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 21v-2a6 6 0 0 1 12 0v2m1-6a5 5 0 0 1 5 5v1"/></svg><span class="nav-text">Team Space</span></a>
          <a href="#logout"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65"><path d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5"/><path d="m15 8 4 4-4 4m4-4H9"/></svg><span class="nav-text">Log out</span></a>
        </nav>
        <button class="user" type="button" aria-label="Open profile for Balikis Ibrahim"><span class="profile-avatar">BI</span><span class="profile-copy"><strong>Balikis Ibrahim</strong><small>Administrator</small></span><svg class="profile-more" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></button>
      </div>
    </aside>
    <section class="main" id="mainContent" tabindex="-1">
      <div class="customers-content">
        <div class="customers-heading"><div class="customers-title"><button class="customers-mobile-menu" type="button" aria-label="Open menu">☰</button><div><h2>Customers</h2><p><span id="customerCount">0</span> customer records</p></div></div><div class="customers-actions"><label class="customer-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg><input id="customerSearch" type="search" placeholder="Search customers" aria-label="Search customer records"></label><button id="filterButton" class="secondary-action" type="button" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6h16M7 12h10m-7 6h4"/></svg>Filter</button><button id="addCustomer" class="primary-action" type="button">+ Add customer</button></div></div>
        <div id="filterPanel" class="filter-panel" hidden><label>Company<select id="companyFilter"><option value="">All companies</option></select></label><button id="clearFilter" type="button">Clear filter</button></div>
        <section class="customers-table-card" aria-labelledby="customersTableTitle"><h3 id="customersTableTitle" class="sr-only">Customer directory</h3><div class="table-wrap"><table><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Company</th><th>Created date</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody id="customerRows"></tbody></table></div><div id="emptyCustomers" class="empty-customers" hidden>No customers match your search.</div><footer class="pagination"><span id="paginationSummary"></span><nav aria-label="Customer table pages"><button id="previousPage" type="button">‹ Previous</button><span id="paginationPages"></span><button id="nextPage" type="button">Next ›</button></nav></footer></section>
      </div>
    </section>
  </main>
  <button class="drawer-backdrop" tabindex="-1" aria-label="Close navigation" hidden></button>
  <div id="rowActions" class="row-actions" hidden><button type="button" data-action="view">View customer</button><button type="button" data-action="edit">Edit customer</button><button type="button" data-action="delete">Delete customer</button></div>
  <dialog id="customerDialog"><form id="customerForm" method="dialog"><div class="dialog-heading"><div><h2 id="customerDialogTitle">Add customer</h2><p id="customerDialogIntro">Create a new customer record.</p></div><button id="closeCustomerDialog" type="button" aria-label="Close">×</button></div><div class="form-grid"><label>Full name<input name="name" required autocomplete="name"></label><label>Phone<input name="phone" required autocomplete="tel"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Company<input name="company" required autocomplete="organization"></label></div><div class="dialog-actions"><button id="cancelCustomer" type="button">Cancel</button><button id="saveCustomer" class="primary-action" type="submit">Add customer</button></div></form></dialog>
  <div id="customerToast" role="status" aria-live="polite"></div>
  <script src="customers.js"></script>
</body>
</html>
