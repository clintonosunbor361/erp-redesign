<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Orders — Siohioma</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="design-system/tokens.css"><link rel="stylesheet" href="design-system/components.css"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="customers.css"><link rel="stylesheet" href="orders.css"><link rel="stylesheet" href="design-system/typography.css"></head>
<body><main class="app customers-app"><aside class="sidebar" id="sidebar">

<nav aria-label="Main navigation"><a href="index.html" data-theme-link aria-label="Dashboard"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span class="nav-text">Dashboard</span></a><a class="active" aria-current="page" href="orders.html" aria-label="Orders"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65"><path d="M5 7h14l2 14H3L5 7Z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/></svg><span class="nav-text">Orders</span></a><a href="inventory.html" data-theme-link><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65"><path d="m4 7 8-4 8 4-8 4-8-4Z"/><path d="m4 7v10l8 4 8-4V7M12 11v10"/></svg><span class="nav-text">Inventory</span></a><a href="customers.html" data-theme-link><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65"><circle cx="9" cy="8" r="3"/><path d="M3 21v-2a6 6 0 0 1 12 0v2m1-16a3 3 0 0 1 0 6m2 4a5 5 0 0 1 3 4v2"/></svg><span class="nav-text">Customers</span></a><a href="#analytics"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65"><path d="M4 3v18h17M8 17v-5m5 5V7m5 10V4"/></svg><span class="nav-text">Analytics</span></a></nav>
<div class="sidebar-footer"><div class="divider"></div><nav><a href="#settings"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65"><path d="m9 3 1-2h4l1 2 3 2 2 1v4l-1 2 1 2v4l-3 1-2 2h-5l-2-2-3-1v-4l1-2-1-2V6l2-1 2-2Z"/><circle cx="12" cy="12" r="3"/></svg><span class="nav-text">Settings</span></a><a href="#team"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 21v-2a6 6 0 0 1 12 0v2m1-6a5 5 0 0 1 5 5v1"/></svg><span class="nav-text">Team Space</span></a><a href="#logout"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65"><path d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5"/><path d="m15 8 4 4-4 4m4-4H9"/></svg><span class="nav-text">Log out</span></a></nav><button class="user" type="button"><span class="profile-avatar">BI</span><span class="profile-copy"><strong>Balikis Ibrahim</strong><small>Administrator</small></span><svg class="profile-more" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></button></div></aside>
<section class="main" id="mainContent" tabindex="-1"><div class="customers-content orders-content"><div class="customers-heading"><div class="customers-title"><button class="customers-mobile-menu" type="button" aria-label="Open menu">☰</button><div><h2>Orders</h2><p><span id="orderCount">0</span> order records</p></div></div><div class="customers-actions"><label class="customer-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg><input id="orderSearch" type="search" placeholder="Search orders" aria-label="Search orders"></label><button id="filterButton" class="secondary-action" type="button" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6h16M7 12h10m-7 6h4"/></svg>Filter</button><div class="view-toggle" role="group" aria-label="Order layout"><button class="active" type="button" data-order-view="table" aria-pressed="true" aria-label="Table view" title="Table view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><button type="button" data-order-view="grid" aria-pressed="false" aria-label="Grid view" title="Grid view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></button></div><button id="addOrder" class="primary-action" type="button">+ Add order</button></div></div>
<nav class="order-tabs" aria-label="Order status"><button class="active" data-status="all" aria-pressed="true">All <span></span></button><button data-status="Pending">Pending <span></span></button><button data-status="Processing">Processing <span></span></button><button data-status="Shipped">Shipped <span></span></button><button data-status="Completed">Completed <span></span></button><button data-status="Cancelled">Cancelled <span></span></button></nav>
<div id="filterPanel" class="filter-panel" hidden><label>Minimum amount<input id="minimumAmount" type="number" min="0" step="1000" placeholder="₦0"></label><button id="clearFilter" type="button">Clear filter</button></div>
<section class="customers-table-card orders-table-card"><div id="orderTableView" class="table-wrap"><table><thead><tr><th>Order ID</th><th>Customer</th><th>Items</th><th>Amount</th><th>Status</th><th>Order date</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody id="orderRows"></tbody></table></div><div id="orderGridView" class="orders-grid" hidden></div><div id="emptyOrders" class="empty-customers" hidden>No orders match this view.</div><footer class="pagination"><span id="paginationSummary"></span><nav aria-label="Order pages"><button id="previousPage" type="button">‹ Previous</button><span id="paginationPages"></span><button id="nextPage" type="button">Next ›</button></nav></footer></section></div></section></main>
<button class="drawer-backdrop" tabindex="-1" hidden></button><div id="rowActions" class="row-actions" hidden><button type="button" data-action="view">View order</button><button type="button" data-action="edit">Edit order</button><button type="button" data-action="delete">Delete order</button></div><div id="statusMenu" class="status-menu" hidden><button type="button" data-status-option="Pending"><i></i>Pending</button><button type="button" data-status-option="Processing"><i></i>Processing</button><button type="button" data-status-option="Shipped"><i></i>Shipped</button><button type="button" data-status-option="Completed"><i></i>Completed</button><button type="button" data-status-option="Cancelled"><i></i>Cancelled</button></div>
<dialog id="orderDialog"><form id="orderForm"><div class="dialog-heading"><div><h2 id="orderDialogTitle">Add order</h2><p id="orderDialogIntro">Create a new order record.</p></div><button id="closeOrderDialog" type="button">×</button></div><div class="form-grid"><label>Customer<input name="customer" required></label><label>Items<input name="items" type="number" min="1" required></label><label>Amount<input name="amount" type="number" min="0" step="1000" required></label><label>Status<select name="status"><option>Pending</option><option>Processing</option><option>Shipped</option><option>Completed</option><option>Cancelled</option></select></label></div><div class="dialog-actions"><button id="cancelOrder" type="button">Cancel</button><button id="saveOrder" class="primary-action" type="submit">Add order</button></div></form></dialog><dialog id="statusConfirm"><div><h2>Update order status?</h2><p id="statusConfirmText"></p><div class="dialog-actions"><button id="cancelStatus" type="button">Cancel</button><button id="confirmStatus" class="primary-action" type="button">Confirm update</button></div></div></dialog><div id="customerToast" role="status" aria-live="polite"></div><script src="orders.js"></script></body></html>
